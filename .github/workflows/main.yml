name: Build and Deploy
on:
  push:
    branches:
      - main
env:
  DOCKERHUB_IMAGE: danyllo431/adminclinic
jobs:
  deploy:
    name: Build, Push and Deploy main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }}
            ${{ env.DOCKERHUB_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.HOST_RENOVAR }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.KEY_SECRET }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,IMAGE_TAG
          script: |
            set -eu
            echo "$DOCKERHUB_TOKEN" | docker login \
              --username "$DOCKERHUB_USERNAME" \
              --password-stdin
            cd /var/www/html/admin_clinic
            export DOCKERHUB_USERNAME
            export IMAGE_TAG
            docker compose -f docker-compose.yml pull admin-clinic
            docker compose -f docker-compose.yml up -d  admin-clinic
            docker compose -f docker-compose.yml run \
              --rm admin-clinic \
              php artisan migrate --force
            sleep 10
            docker exec admin-clinic php artisan optimize
            docker image prune -f
            docker logout

      - name: Deployment Summary
        if: always()
        run: |
          echo "### Deploy Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image:** ${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Branch:** main" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"

name: Build and Deploy
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Repository checkout
        uses: actions/checkout@v3.5.2

      - name: Executing remote ssh commands using key
        uses: appleboy/ssh-action@v0.1.10
        env:
          ENVPROD: ${{ secrets.ENVPROD }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          envs: ENVPROD
          script: |
            set -euo pipefail
            cd /var/www/html/admin_clinic
            git pull origin main
            printf '%s\n' "$ENVPROD" > .env

            # Ensure a compose version that supports 'services' and 'networks'.
            if command -v docker-compose >/dev/null 2>&1; then
              DC_VERSION="$(docker-compose version --short 2>/dev/null || true)"
            else
              DC_VERSION=""
            fi

            if [ -z "$DC_VERSION" ] || [ "$(printf '%s\n' "1.27.0" "$DC_VERSION" | sort -V | head -n1)" != "1.27.0" ]; then
              mkdir -p "$HOME/.local/bin"
              curl -fsSL "https://github.com/docker/compose/releases/download/1.29.2/docker-compose-$(uname -s)-$(uname -m)" -o "$HOME/.local/bin/docker-compose"
              chmod +x "$HOME/.local/bin/docker-compose"
              export PATH="$HOME/.local/bin:$PATH"
            fi

            make prod-install


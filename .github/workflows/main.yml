name: Build and Deploy
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Repository checkout
        uses: actions/checkout@v3.5.2

      - name: Executing remote ssh commands using key
        uses: appleboy/ssh-action@v0.1.10
        env:
          ENVPROD: ${{ secrets.ENVPROD }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          envs: ENVPROD
          script: |
            set -euo pipefail
            cd /var/www/html/
            git clone git@github.com:danylloweb/admin_clinic.git
            cd admin_clinic
            cat > .env <<'EOF'
            $ENVPROD
            EOF
            make prod-install


name: Build and Deploy
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Repository checkout
        uses: actions/checkout@v3.5.2

      - name: Executing remote ssh commands
        uses: appleboy/ssh-action@v0.1.10
        env:
          ENVPROD: ${{ secrets.ENVPROD }}
        with:
          host: ${{ secrets.HOST_RENOVAR }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.KEY_SECRET }}
          envs: ENVPROD
          script_stop: true
          script: |
            set -e
            cd /var/www/html/
            git clone git@github.com:danylloweb/admin_clinic.git
            cd admin_clinic
            echo "$ENVPROD" > .env
            make prod-install

version: 0.2
env:
  shell: bash
  variables:
    DOCKER_BUILDKIT: 1
    IMAGE_TAG: latest
    IMAGE_NAME_SERVICE: php-fpm
  secrets-manager:
    DB_CONNECTION: ${APP_NAME}:DB_CONNECTION
    DB_DATABASE: ${APP_NAME}:DB_DATABASE
    DB_HOST: ${APP_NAME}:DB_HOST
    DB_PASSWORD: ${APP_NAME}:DB_PASSWORD
    DB_PORT: ${APP_NAME}:DB_PORT
    DB_USERNAME: ${APP_NAME}:DB_USERNAME
    DOCKERHUB_PASSWORD: dockerhub:password
    DOCKERHUB_USERNAME: dockerhub:username
    NEW_RELIC_LICENSE_KEY: newrelic:NEW_RELIC_LICENSE_KEY

phases:
  pre_build:
    run-as: root
    on-failure: ABORT
    commands:
      #-----------------------------------------------------------------------------------------------------------------
      # Export Variables used in Docker build process
      #-----------------------------------------------------------------------------------------------------------------
      - export COMMIT_TAG=${CODEBUILD_RESOLVED_SOURCE_VERSION:0:7}
      #-----------------------------------------------------------------------------------------------------------------
      # Enable debug (x-trace)
      #-----------------------------------------------------------------------------------------------------------------
      - set -x

      #-----------------------------------------------------------------------------------------------------------------
      # AWS ECR and Docker Hub
      #-----------------------------------------------------------------------------------------------------------------
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
      - echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

  build:
    on-failure: ABORT
    commands:
      #-----------------------------------------------------------------------------------------------------------------
      # Build PHP Docker image
      #-----------------------------------------------------------------------------------------------------------------
      - |
          docker build \
            --build-arg APP_NAME=$APP_NAME \
            --build-arg NEW_RELIC_APP_NAME="$APP_NAME" \
            --build-arg NEW_RELIC_LICENSE_KEY=$NEW_RELIC_LICENSE_KEY \
            --build-arg ENV_NAME=$ENVIRONMENT_NAME \
            -t $ECR_URI_SERVICE:$IMAGE_TAG \
            -f docker/Dockerfile .

  post_build:
    on-failure: ABORT
    commands:
      #-----------------------------------------------------------------------------------------------------------------
      # Tag Docker images
      #-----------------------------------------------------------------------------------------------------------------
      - docker tag $ECR_URI_SERVICE:$IMAGE_TAG $ECR_URI_SERVICE:$COMMIT_TAG
      #-----------------------------------------------------------------------------------------------------------------
      # Push Docker images
      #-----------------------------------------------------------------------------------------------------------------
      - docker push --all-tags $ECR_URI_SERVICE
       # Run Laravel Migrations
       #-----------------------------------------------------------------------------------------------------------------
#      - docker run -e "DB_CONNECTION=$DB_CONNECTION" -e "DB_HOST=$DB_HOST" -e "DB_PASSWORD=$DB_PASSWORD" -e "DB_PORT=$DB_PORT" -e "DB_USERNAME=$DB_USERNAME" -e "DB_DATABASE=$DB_DATABASE" $ECR_URI_SERVICE:$IMAGE_TAG php artisan migrate --force
      - docker run -e "DB_CONNECTION=$DB_CONNECTION" -e "DB_HOST=$DB_HOST" -e "DB_PASSWORD=$DB_PASSWORD" -e "DB_PORT=$DB_PORT" -e "DB_USERNAME=$DB_USERNAME" -e "DB_DATABASE=$DB_DATABASE" $ECR_URI_SERVICE:$IMAGE_TAG php artisan db:seed --force
       #-----------------------------------------------------------------------------------------------------------------

      #-----------------------------------------------------------------------------------------------------------------
      # Write webserver json for images definitions
      #-----------------------------------------------------------------------------------------------------------------
      - printf '[' > imagedefinitions.json
      - printf '{"name":"%s","imageUri":"%s"}' $IMAGE_NAME_SERVICE $ECR_URI_SERVICE:$COMMIT_TAG >> imagedefinitions.json
      - printf ']' >> imagedefinitions.json

artifacts:
  files: "imagedefinitions*.json"


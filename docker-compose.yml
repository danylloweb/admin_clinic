services:
    app:
        build:
            context: ./docker
            dockerfile: Dockerfile
        restart: unless-stopped
        working_dir: /var/www/html
        volumes:
            - ./:/var/www/html
        ports:
            - 8001:80
        depends_on:
            - mysql
            - mongo
            - redis
        networks:
            - admin_clinic
    mysql:
        image: epionebr/mysql:tagname
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: renovar
            MYSQL_ROOT_PASSWORD: root
            MYSQL_PASSWORD: root
            MYSQL_USER: root
        volumes:
            - ./data/mysql/dbdata:/var/lib/mysql
        ports:
            - 3306:3306
        command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --innodb-buffer-pool-size=4G
        networks:
            - admin_clinic
    pma:
        image: phpmyadmin/phpmyadmin
        ports:
            - 9006:80
        environment:
            - PMA_ARBITRARY=1
            - UPLOAD_LIMIT=1G
        networks:
            - admin_clinic

    mongo:
        image: mongo
        restart: always
        volumes:
            - ./data/db:/data/db
        networks:
            - admin_clinic

    mongo-express:
        image: mongo-express
        restart: always
        ports:
            - 8084:8081
        environment:
            - ME_CONFIG_MONGODB_SERVER=mongo
            - ME_CONFIG_BASICAUTH=false
        networks:
            - admin_clinic
    redis:
        image: redis
        networks:
            - admin_clinic
